<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#082f35"><title>Admin Dashboard | Smart Digital Seva</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f8f6;color:#17343a;font-family:system-ui,Arial,sans-serif;line-height:1.55}header{background:linear-gradient(120deg,#082f35,#0b625b);color:#fff;padding:18px 16px}.head,main{max-width:1000px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900}.brand small{display:block;color:#c9e9df;font-weight:500}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:25px;padding:7px 12px;font-size:13px}main{padding:25px 15px 45px}.panel,.app{background:#fff;border:1px solid #dce9e5;border-radius:16px;padding:19px;margin-bottom:14px;box-shadow:0 8px 25px #082f3509}.panel{max-width:520px;margin:20px auto}.eyebrow{font-size:12px;color:#087e78;font-weight:900;letter-spacing:.6px}h1{font-size:26px;color:#082f35;margin:6px 0}p{color:#60777a;font-size:14px}label{display:block;font-weight:800;font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #cbded8;border-radius:9px;padding:10px;font:inherit;background:#fff}textarea{min-height:65px}button,.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;background:#087e78;color:white;font:inherit;font-weight:850;padding:10px 14px;margin-top:12px;cursor:pointer;text-decoration:none}button:disabled{opacity:.6}.secondary{background:#e8f4ef;color:#075b53}.danger{background:#a43d34}.muted{font-size:12px;color:#718481}.msg{padding:12px;border-radius:10px;background:#fff4df;color:#725719;font-size:13px;margin-top:12px;display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.app h3{margin:0;color:#082f35;font-size:17px}.app p{margin:4px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{font-weight:900;color:#087e78}.doc{font-size:12px;padding:7px;background:#f3f8f6;border-radius:8px;margin:5px 0}@media(max-width:500px){.head{align-items:flex-start}.app{padding:15px}}
</style></head><body><header><div class="head"><div class="brand">SMART DIGITAL SEVA<small>Private Admin Dashboard</small></div><a class="back" href="./index.html">View Website</a></div></header>
<main><section class="panel" id="loginPanel"><div class="eyebrow">ADMIN SIGN IN</div><h1>Admin Login</h1><p>Only the approved business email can access customer applications. We will send a secure sign-in link to your inbox.</p><form id="loginForm"><label for="email">Admin email</label><input id="email" type="email" value="smartdigitalseva05@gmail.com" required autocomplete="email"><button id="loginBtn">Send secure login link</button></form><div id="loginMsg" class="msg"></div></section>
<section id="dashboard" style="display:none"><div class="row" style="justify-content:space-between;margin-bottom:15px"><div><div class="eyebrow">APPLICATION MANAGEMENT</div><h1>Customer Applications</h1><p id="signedIn" class="muted"></p></div><button id="refreshBtn" class="secondary">Refresh</button><button id="logoutBtn" class="danger">Sign out</button></div><div id="listMsg" class="msg"></div><div id="apps" class="grid"></div></section></main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.75.0";
const SUPABASE_URL="https://fgjcudwglwlizhhlmruk.supabase.co",PUBLISHABLE_KEY="sb_publishable_v7CERFljtqM-6O692eZzNA_aH6DEedu";
const ADMIN_EMAIL="smartdigitalseva05@gmail.com",FUNCTION_URL=SUPABASE_URL+"/functions/v1/sds-admin";
const supabase=createClient(SUPABASE_URL,PUBLISHABLE_KEY);
const labels={pending:"Pending",reviewing:"Reviewing",need_documents:"Need documents",processing:"Processing",completed:"Completed",rejected:"Rejected"};
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function msg(id,text){const e=document.getElementById(id);e.textContent=text;e.style.display="block";}
async function adminCall(payload){const {data:{session}}=await supabase.auth.getSession();if(!session)throw new Error("Please sign in again.");const r=await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json","apikey":PUBLISHABLE_KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");return j;}
async function showSession(){const {data:{session}}=await supabase.auth.getSession();if(!session){document.getElementById("loginPanel").style.display="block";document.getElementById("dashboard").style.display="none";return;}if((session.user.email||"").toLowerCase()!==ADMIN_EMAIL){await supabase.auth.signOut();msg("loginMsg","This email is not approved for admin access.");return;}document.getElementById("loginPanel").style.display="none";document.getElementById("dashboard").style.display="block";document.getElementById("signedIn").textContent="Signed in: "+session.user.email;await loadApps();}
async function loadApps(){const box=document.getElementById("apps");box.innerHTML="<p>Loading applications...</p>";try{const d=await adminCall({action:"list"});if(!d.applications.length){box.innerHTML="<p>No applications received yet.</p>";return;}box.innerHTML=d.applications.map(a=>{const docs=d.documents.filter(x=>x.application_id===a.id);return '<article class="app" data-id="'+esc(a.id)+'"><h3>'+esc(a.customer_name)+' · '+esc(a.service_name)+'</h3><p>Tracking: <strong>'+esc(a.tracking_code)+'</strong></p><p>Mobile: '+esc(a.phone)+'</p><p>Received: '+new Date(a.created_at).toLocaleString()+'</p><p>Customer note: '+esc(a.customer_message||"—")+'</p><p>Current status: <span class="status">'+esc(labels[a.status]||a.status)+'</span></p><label>Status</label><select class="newStatus">'+Object.keys(labels).map(k=>'<option value="'+k+'" '+(k===a.status?"selected":"")+'>'+labels[k]+'</option>').join("")+'</select><label>Internal admin note (not visible to customer)</label><textarea class="adminNote">'+esc(a.admin_note||"")+'</textarea><label>Public update shown in tracking</label><input class="publicNote" maxlength="500" placeholder="Write a short customer update"><button class="saveBtn">Save status</button><div class="muted">'+docs.length+' document(s)</div>'+docs.map(x=>'<div class="doc">📎 '+esc(x.original_name)+' <button class="secondary docBtn" data-doc="'+esc(x.id)+'">Open secure file</button></div>').join("")+'</article>';}).join("");}
catch(e){box.innerHTML="";msg("listMsg",e.message);}}
document.getElementById("apps").addEventListener("click",async e=>{const card=e.target.closest(".app");if(!card)return;try{if(e.target.classList.contains("saveBtn")){e.target.disabled=true;await adminCall({action:"update",id:card.dataset.id,status:card.querySelector(".newStatus").value,note:card.querySelector(".adminNote").value,publicNote:card.querySelector(".publicNote").value});alert("Application status updated.");await loadApps();}else if(e.target.classList.contains("docBtn")){e.target.disabled=true;const d=await adminCall({action:"document-link",documentId:e.target.dataset.doc});window.open(d.url,"_blank","noopener");e.target.disabled=false;}}catch(ex){alert(ex.message);}});
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=document.getElementById("email").value.trim().toLowerCase(),btn=document.getElementById("loginBtn");if(email!==ADMIN_EMAIL){msg("loginMsg","Only the approved business email is allowed.");return;}btn.disabled=true;btn.textContent="Sending...";try{const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.origin+window.location.pathname,shouldCreateUser:true}});if(error)throw error;msg("loginMsg","Secure sign-in link sent. Open the email inbox and tap the link on this device.");}catch(ex){msg("loginMsg",ex.message);}finally{btn.disabled=false;btn.textContent="Send secure login link";}});
document.getElementById("refreshBtn").addEventListener("click",loadApps);
document.getElementById("logoutBtn").addEventListener("click",async()=>{await supabase.auth.signOut();await showSession();});
supabase.auth.onAuthStateChange(()=>{setTimeout(showSession,0);});
showSession();
</script></body></html>
