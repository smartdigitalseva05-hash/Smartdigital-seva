name: Inspect and clear stale GitHub Pages deployment

on:
  push:
    paths:
      - ".github/workflows/clear-stuck-pages.yml"

permissions:
  pages: write

jobs:
  inspect-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the old Pages deployment state
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = "e15273f49695eebdee62bba3ea290cfe7d502bb9";
            const result = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}", {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pages_deployment_id: staleSha
            });
            core.info("GitHub Pages deployment state: " + JSON.stringify(result.data));
            if (result.data.status === "in_progress" || result.data.status === "queued" || result.data.status === "pending") {
              await github.request("POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pages_deployment_id: staleSha
              });
              core.info("Cancellation requested for stale deployment.");
            } else {
              core.info("GitHub reports the old Pages deployment is already finished; no cancellation is possible through this endpoint.");
            }
