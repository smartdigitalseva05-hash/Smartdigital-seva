name: Lyrics Sync quality checks

on:
  push:
    branches: ["main"]
    paths:
      - "lyrics-sync/**"
      - ".github/workflows/lyrics-sync-check.yml"
  pull_request:
    paths:
      - "lyrics-sync/**"
      - ".github/workflows/lyrics-sync-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile lyrics-sync/app.py
      - name: Check frontend structure
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.tags = set()
              def handle_starttag(self, tag, attrs):
                  self.tags.add(tag)

          page = Path("lyrics-sync/index.html").read_text(encoding="utf-8")
          parser = PageCheck()
          parser.feed(page)
          parser.close()

          required = ("audio", "textarea", "button", "script")
          missing = [tag for tag in required if tag not in parser.tags]
          if missing:
              raise SystemExit("Missing required frontend elements: " + ", ".join(missing))
          if "/api/sync" not in page:
              raise SystemExit("Frontend does not reference the sync API endpoint.")
          print("Frontend structure check passed.")
          import re
          scripts = re.findall(r"<script>(.*?)</script>", page, flags=re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found.")
          Path("/tmp/lyrics-sync.js").write_text("\\n".join(scripts), encoding="utf-8")
      - name: Check frontend JavaScript syntax
        run: node --check /tmp/lyrics-sync.js
          PY
