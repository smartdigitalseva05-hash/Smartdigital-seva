name: AppForge APK Builder

on:
  push:
    paths:
      - ".github/workflows/appforge-apk.yml"
  workflow_dispatch:
    inputs:
      app_name:
        description: App display name
        required: true
        default: My Website App
        type: string
      package_id:
        description: Android package ID
        required: true
        default: com.example.mywebsiteapp
        type: string
      website_url:
        description: HTTPS website URL to open in the APK
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate safe Android project
        env:
          APP_NAME: ${{ inputs.app_name || 'Smart Business Pro' }}
          PACKAGE_ID: ${{ inputs.package_id || 'com.smartbusinesspro.app' }}
          WEBSITE_URL: ${{ inputs.website_url || 'https://smartdigitalseva05-hash.github.io/smart-grocery-store-pro/' }}
        run: |
          python3 - <<'PY'
          import os, re, json, html
          from pathlib import Path
          from urllib.parse import urlparse

          app = os.environ["APP_NAME"].strip()
          package = os.environ["PACKAGE_ID"].strip()
          url = os.environ["WEBSITE_URL"].strip()
          if not app or len(app) > 40 or any(ord(c) < 32 for c in app):
              raise SystemExit("App name must be 1–40 printable characters.")
          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(?:\.[A-Za-z][A-Za-z0-9_]*)+", package):
              raise SystemExit("Invalid package ID.")
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise SystemExit("Enter a valid public HTTPS website URL.")

          pkg_path = package.replace(".", "/")
          Path(f"app/src/main/java/{pkg_path}").mkdir(parents=True, exist_ok=True)
          Path("app/src/main").mkdir(parents=True, exist_ok=True)
          Path("settings.gradle").write_text(
              'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n'
              'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\n'
              'rootProject.name = "AppForgeBuild"\ninclude(":app")\n')
          Path("build.gradle").write_text(
              'plugins { id "com.android.application" version "8.6.1" apply false }\n')
          Path("app/build.gradle").write_text(
              'plugins { id "com.android.application" }\n'
              f'android {{ namespace "{package}"; compileSdk 35; defaultConfig {{ applicationId "{package}"; minSdk 23; targetSdk 35; versionCode 1; versionName "1.0" }} }}\n')
          label = html.escape(app, quote=True)
          Path("app/src/main/AndroidManifest.xml").write_text(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '<uses-permission android:name="android.permission.INTERNET"/>\n'
              f'<application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="{label}" android:usesCleartextTraffic="false">\n'
              '<activity android:name=".MainActivity" android:exported="true"><intent-filter>'
              '<action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/>'
              '</intent-filter></activity></application></manifest>\n')
          java = f'''package {package};
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          public class MainActivity extends Activity {{
            @Override public void onCreate(Bundle state) {{
              super.onCreate(state);
              WebView web = new WebView(this);
              WebSettings settings = web.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              web.setWebViewClient(new WebViewClient());
              setContentView(web);
              web.loadUrl({json.dumps(url)});
            }}
          }}
          '''
          Path(f"app/src/main/java/{pkg_path}/MainActivity.java").write_text(java)
          Path("BUILD-INFO.txt").write_text(f"App: {app}\nPackage: {package}\nWebsite: {url}\n")
          PY
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AppForge-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
