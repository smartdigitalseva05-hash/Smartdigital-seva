services:
  - type: web
    name: auto-lyrics-sync-api
    runtime: python
    plan: free
    rootDir: lyrics-sync
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: WHISPER_MODEL
        value: tiny
